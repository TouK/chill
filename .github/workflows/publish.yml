name: Publish
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
      - name: Check for SNAPSHOT version
        run: echo "IS_SNAPSHOT=$(sbt --no-colors -Dsbt.supershell=false 'show isSnapshot' | grep 'info' | tail -1 | awk '{print $2}')" >> $GITHUB_ENV
      - name: Build and publish release to Sonatype Central Repository
        if: ${{ env.IS_SNAPSHOT == 'false' }}
        run: sbt "+clean; +publishSigned; sonaRelease"
      - name: Build and publish snapshot to Sonatype Central Repository
        if: ${{ env.IS_SNAPSHOT == 'true' }}
        run: sbt "+clean; +publishSigned"
